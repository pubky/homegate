name: 'Build and Release'

on:
  push:
    tags:
      - 'v*'

# This workflow will trigger on tags to build and create a release
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Get version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build binary
        run: cargo build --release

      - name: Rename binary
        run: cp target/release/homegate homegate-${{ steps.version.outputs.version }}-linux-amd64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: homegate-*
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: artifacts/**/homegate-*
          generate_release_notes: true
          draft: true